name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-windows:
    name: Python tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q agent audio mobile_api plugins security tools ui tests Startingup_Files main.py config.py
      - name: Security and reliability regression tests
        run: python -m pytest -q tests/test_security_reliability_regressions.py tests/test_scheduler_reliability.py tests/test_plugin_marketplace_security.py
      - name: Phase 0 smoke tests
        run: python tests/phase0_smoke_tests.py
      - name: Package source archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: git archive --format=zip --output=VoiceAssistant-source.zip HEAD
      - name: Upload source archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-source
          path: VoiceAssistant-source.zip
          if-no-files-found: error
          retention-days: 14

  flutter-mobile:
    name: Flutter validation and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice_assistant_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-android-apk
          path: voice_assistant_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-windows, flutter-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: voice-assistant-source
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: voice-assistant-android-apk
          path: release-assets
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/VoiceAssistant-source.zip
            release-assets/app-release.apk
