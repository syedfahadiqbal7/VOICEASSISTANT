name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-windows:
    name: Python tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q agent audio mobile_api plugins security tools ui tests Startingup_Files main.py config.py backup_cli.py privacy_cli.py mobile_device_cli.py data_key_cli.py key_migration_cli.py
      - name: Security and reliability regression tests
        run: python -m pytest -q tests/test_security_reliability_regressions.py tests/test_mobile_device_identity.py tests/test_mobile_registry_process_lock.py tests/test_mobile_rate_limiter.py tests/test_mobile_rbac.py tests/test_mobile_approval_routing.py tests/test_user_profile.py tests/test_calendar_recurrence.py tests/test_scheduler_history.py tests/test_scheduler_history_integration.py tests/test_scheduler_reliability.py tests/test_scheduler_ui_state.py tests/test_scheduled_execution_ledger.py tests/test_scheduled_tool_idempotency.py tests/test_plugin_marketplace_security.py tests/test_plugin_worker_isolation.py tests/test_plugin_capability_inventory.py tests/test_plugin_capability_policy.py tests/test_data_protection.py tests/test_keyring.py tests/test_data_protection_v2.py tests/test_key_migration.py tests/test_key_migration_cli.py tests/test_key_rotation.py tests/test_key_recovery.py tests/test_key_retirement.py tests/test_scheduled_write_undo_safety.py tests/test_backup_manager.py tests/test_privacy_manager.py tests/test_observability.py
      - name: Generate plugin capability inventory
        run: python tools/plugin_capability_inventory.py --plugins-dir plugins --format markdown --output plugin-capability-inventory.md
      - name: Upload plugin capability inventory
        uses: actions/upload-artifact@v7
        with:
          name: plugin-capability-inventory
          path: plugin-capability-inventory.md
          if-no-files-found: error
          retention-days: 14
      - name: Phase 0 smoke tests
        run: python tests/phase0_smoke_tests.py
      - name: Package source archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: git archive --format=zip --output=VoiceAssistant-source.zip HEAD
      - name: Upload source archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: voice-assistant-source
          path: VoiceAssistant-source.zip
          if-no-files-found: error
          retention-days: 14

  flutter-mobile:
    name: Flutter validation and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice_assistant_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: voice-assistant-android-apk
          path: voice_assistant_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  flutter-ios:
    name: iOS validation and unsigned build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: voice_assistant_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-windows, flutter-mobile, flutter-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v8
        with:
          name: voice-assistant-source
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: voice-assistant-android-apk
          path: release-assets
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            **DEVELOPMENT PRE-RELEASE — NOT PRODUCTION SIGNED**

            The Android APK in this release is built with the repository's debug signing configuration. The iOS workflow validates an unsigned build only; no signed IPA is provided. Do not distribute this build as a production mobile release.
          files: |
            release-assets/VoiceAssistant-source.zip
            release-assets/app-release.apk
