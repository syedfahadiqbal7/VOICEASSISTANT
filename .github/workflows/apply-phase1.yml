name: Apply Phase 1 scheduler hardening

on:
  push:
    branches: [main]
    paths:
      - 'tools/phase1_scheduler_hardening.patch'

permissions:
  contents: write

jobs:
  python-validation:
    if: github.actor == 'syedfahadiqbal7'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply phase patch
        run: git apply tools/phase1_scheduler_hardening.patch
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile all Python sources
        run: python -m compileall -q agent audio mobile_api plugins security tools ui tests Startingup_Files main.py config.py
      - name: Run Python regression tests
        run: python -m pytest -q tests
      - name: Run Phase 0 smoke tests
        run: python tests/phase0_smoke_tests.py
      - name: Verify plugin registry
        run: python -c "from agent.tool_registry import ToolRegistry; r=ToolRegistry(); print('Registered tools:', len(r._tools)); assert len(r._tools) == 61"

  flutter-validation:
    if: github.actor == 'syedfahadiqbal7'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice_assistant_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Apply phase patch
        working-directory: .
        run: git apply tools/phase1_scheduler_hardening.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

  commit-phase:
    if: github.actor == 'syedfahadiqbal7'
    needs: [python-validation, flutter-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated patch
        run: git apply tools/phase1_scheduler_hardening.patch
      - name: Remove one-time patch runner
        run: |
          git rm tools/phase1_scheduler_hardening.patch .github/workflows/apply-phase1.yml
      - name: Commit phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml README.md WORLD_CLASS_AUDIT_REPORT.md agent/conversation_manager.py agent/scheduler.py agent/session_sync.py tests/test_scheduler_reliability.py voice_assistant_mobile/lib/screens/schedules_screen.dart
          git commit -m "Harden scheduler crash recovery and retries"
          git push origin HEAD:main
